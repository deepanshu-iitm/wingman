<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wingman — Match Me</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <h1>Wingman</h1>
      <span id="conn-status" class="pill">connecting…</span>
    </header>

    <main>
      <!-- Persona setup -->
      <section id="setup" class="card">
        <h2>Your persona</h2>
        <div class="voice-onboarding">
          <p class="muted">
            Tell Wingman about yourself, then review the generated profile before saving it.
          </p>
          <label class="consent-row" for="voice-consent">
            <input id="voice-consent" type="checkbox" />
            <span>
              I consent to sending this recording for transcription. Wingman does not store the
              raw recording.
            </span>
          </label>
          <div class="voice-actions">
            <button id="voice-record" type="button">🎙 Start recording</button>
            <button id="voice-stop" type="button" disabled>Stop</button>
          </div>
          <p id="voice-status" class="voice-status" role="status" aria-live="polite">
            Enter your name, then record for up to two minutes.
          </p>
        </div>

        <p class="muted">Review and edit your persona before creating it.</p>
        <form id="persona-form">
          <input id="f-name" placeholder="Display name" required />
          <input id="f-summary" placeholder="One-line summary" />
          <input id="f-interests" placeholder="Interests (comma separated)" />
          <input id="f-values" placeholder="Values (comma separated)" />
          <input id="f-style" placeholder="Social style (e.g. warm, adventurous)" />
          <button type="submit">Create persona</button>
        </form>

        <div id="mine">
          <label for="active-persona">Match as:</label>
          <select id="active-persona"></select>
          <button id="match-btn" disabled>💘 Match Me</button>
        </div>
      </section>

      <!-- Live matching board -->
      <section id="board" class="card hidden">
        <h2>Finding your people…</h2>
        <p id="board-meta" class="muted"></p>
        <div id="convos" class="convo-grid"></div>
        <p id="others" class="muted"></p>
      </section>

      <!-- Final results -->
      <section id="results" class="card hidden">
        <h2>Your top matches</h2>
        <div id="result-cards"></div>
      </section>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
